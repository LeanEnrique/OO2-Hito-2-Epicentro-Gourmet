<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Unidades con mayor canon')}"></head>
<body>
	<header th:replace="~{fragments :: nav}"></header>
	<main>
		<p><a class="boton secundario" th:href="@{/admin(festival=${seleccionado?.id})}">← Volver al panel</a></p>
		<h1>Unidades con mayor canon</h1>

		<p class="error" th:if="${seleccionado == null}">El festival elegido no existe.</p>

		<th:block th:if="${seleccionado != null}">
			<h2 th:text="${seleccionado.nombre}"></h2>
			<form th:action="@{/admin/mayor-canon}" method="get" class="en-linea">
				<input type="hidden" name="festival" th:value="${seleccionado.id}">
				<label class="corto">Cantidad de unidades
					<input type="number" name="x" min="1" th:value="${x}" required>
				</label>
				<button type="submit">Consultar</button>
			</form>
		</th:block>
		<p class="error" th:if="${error}" th:text="${error}"></p>

		<section th:if="${mayoresCanon != null}">
			<p th:if="${mayoresCanon.isEmpty()}">No hay unidades en este festival.</p>
			<table th:unless="${mayoresCanon.isEmpty()}">
				<thead>
					<tr><th>#</th><th>Nombre comercial</th><th>Código</th><th>Tipo</th><th class="monto">Canon</th></tr>
				</thead>
				<tbody>
					<tr th:each="u, st : ${mayoresCanon}">
						<td th:text="${st.count}"></td>
						<td th:text="${u.nombreComercial}"></td>
						<td th:text="${u.codigo}"></td>
						<td th:text="${u.tipo}"></td>
						<td class="monto" th:text="'$ ' + ${#numbers.formatDecimal(u.canon, 1, 'POINT', 2, 'COMMA')}"></td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>
</body>
</html>
