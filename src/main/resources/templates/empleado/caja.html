<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Caja')}"></head>
<body>
	<header th:replace="~{fragments :: nav}"></header>
	<main class="angosto">
		<h1>Caja</h1>
		<div th:replace="~{fragments :: mensajes}"></div>

		<p th:text="${cajero.nombreCompleto} + ' · Turno ' + ${cajero.turno.descripcion}"></p>

		<p class="error" th:if="${asignacion == null and abierta == null}">
			Hoy no tenés un festival activo asignado, así que no podés abrir la caja.
		</p>

		<!-- Caja abierta: los totales salen de los pedidos que se van tomando -->
		<th:block th:if="${abierta != null}">
			<section class="hoy activo">
				<p>Caja abierta · <strong th:text="${abierta.festival.nombre} + ' · ' + ${abierta.unidad.nombreComercial}"></strong></p>
				<p th:text="${cantidadPedidos} + (${cantidadPedidos == 1} ? ' pedido' : ' pedidos') + ' · Ventas: $ ' + ${#numbers.formatDecimal(ventasDelDia, 1, 'POINT', 2, 'COMMA')}"></p>
				<p><a class="boton secundario" th:href="@{/empleado/pedidos}">Ver pedidos</a></p>
			</section>
			<form th:action="@{/empleado/caja/cerrar}" method="post">
				<button type="submit">Cerrar caja</button>
			</form>
		</th:block>

		<!-- Sin caja abierta: puede reanudar la última de hoy o abrir una nueva -->
		<th:block th:if="${abierta == null and asignacion != null}">
			<section class="hoy">
				<p th:text="${asignacion.festival.nombre} + ' · ' + ${asignacion.unidad.nombreComercial}"></p>
				<p class="nota" th:if="${reanudable != null}"
					th:text="'Cerraste la caja a las ' + ${#temporals.format(reanudable.fechaHoraCierre, 'HH:mm')} + ' con ' + ${reanudable.cantidadPedidos} + (${reanudable.cantidadPedidos == 1} ? ' pedido' : ' pedidos') + ' por $ ' + ${#numbers.formatDecimal(reanudable.ventasDelDia, 1, 'POINT', 2, 'COMMA')} + '. Podés reanudarla o abrir una nueva.'"></p>
				<p class="nota" th:if="${reanudable == null}">Abrí la caja para empezar a tomar pedidos.</p>
				<div class="acciones-form">
					<form th:if="${reanudable != null}" th:action="@{/empleado/caja/reanudar}" method="post">
						<button type="submit">Reanudar caja</button>
					</form>
					<form th:action="@{/empleado/caja/abrir}" method="post">
						<button type="submit" th:classappend="${reanudable != null} ? 'boton secundario'" th:text="${reanudable != null} ? 'Abrir caja nueva' : 'Abrir caja'"></button>
					</form>
				</div>
			</section>
		</th:block>

		<h2>Historial de cajas</h2>
		<p th:if="${historial.isEmpty()}">Todavía no abriste ninguna caja.</p>
		<table th:unless="${historial.isEmpty()}">
			<thead>
				<tr>
					<th>Fecha</th>
					<th>Turno</th>
					<th>Unidad</th>
					<th>Cierre</th>
					<th class="monto">Pedidos</th>
					<th class="monto">Ventas</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="c : ${historial}">
					<td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
					<td th:text="${c.turno.descripcion}"></td>
					<td th:text="${c.unidad.nombreComercial}"></td>
					<th:block th:if="${c.estaAbierta()}">
						<td>Abierta</td>
						<td class="monto" th:text="${cantidadPedidos}"></td>
						<td class="monto" th:text="'$ ' + ${#numbers.formatDecimal(ventasDelDia, 1, 'POINT', 2, 'COMMA')}"></td>
					</th:block>
					<th:block th:unless="${c.estaAbierta()}">
						<td th:text="${#temporals.format(c.fechaHoraCierre, 'HH:mm')}"></td>
						<td class="monto" th:text="${c.cantidadPedidos}"></td>
						<td class="monto" th:text="'$ ' + ${#numbers.formatDecimal(c.ventasDelDia, 1, 'POINT', 2, 'COMMA')}"></td>
					</th:block>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
