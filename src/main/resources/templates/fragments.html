<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${titulo} + ' | Epicentro Gourmet'">Epicentro Gourmet</title>
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
	<header th:fragment="nav">
		<div class="barra">
			<a th:href="@{/}" class="logo"><img th:src="@{/img/logo-unla.png}" alt="Universidad Nacional de Lanús"></a>
			<a th:href="@{/}" class="marca">Epicentro Gourmet</a>
			<div class="cuenta">
				<th:block sec:authorize="isAnonymous()">
					<a th:href="@{/registro}">Registrar unidad</a>
					<a th:href="@{/login}" class="boton-claro">Iniciar sesión</a>
				</th:block>
				<th:block sec:authorize="isAuthenticated()">
					<span class="usuario" sec:authentication="name"></span>
					<span class="chip-rol" sec:authorize="hasRole('ADMINISTRADOR')">Administrador</span>
					<span class="chip-rol" sec:authorize="hasRole('RESPONSABLE')">Responsable</span>
					<span class="chip-rol" sec:authorize="hasRole('EMPLEADO')">Empleado</span>
					<form th:action="@{/logout}" method="post" class="inline">
						<button type="submit">Salir</button>
					</form>
				</th:block>
			</div>
		</div>
		<!-- Secciones según el rol (una sola entrada por destino) -->
		<nav class="secciones" sec:authorize="isAuthenticated()" th:with="r=${rutaActual ?: ''}">
			<th:block sec:authorize="hasRole('ADMINISTRADOR')">
				<a th:href="@{/admin}" th:classappend="${r == '/admin'} ? 'activa'">Festivales</a>
				<a th:href="@{/admin/ranking}" th:classappend="${r == '/admin/ranking'} ? 'activa'">Recaudación y ranking</a>
				<a th:href="@{/admin/mayor-canon}" th:classappend="${r == '/admin/mayor-canon'} ? 'activa'">Mayor canon</a>
				<a th:href="@{/admin/rentabilidad}" th:classappend="${r == '/admin/rentabilidad'} ? 'activa'">Rentabilidad</a>
				<a th:href="@{/admin/plato-estrella}" th:classappend="${r == '/admin/plato-estrella'} ? 'activa'">Plato estrella</a>
			</th:block>
			<th:block sec:authorize="hasRole('RESPONSABLE')">
				<a th:href="@{/responsable}" th:classappend="${r == '/responsable' or r.startsWith('/responsable/festivales')} ? 'activa'">Mi unidad</a>
				<a th:href="@{/responsable/empleados}" th:classappend="${r.startsWith('/responsable/empleados')} ? 'activa'">Empleados</a>
				<a th:href="@{/responsable/platos}" th:classappend="${r.startsWith('/responsable/platos')} ? 'activa'">Platos</a>
				<a th:href="@{/responsable/reportes}" th:classappend="${r.startsWith('/responsable/reportes')} ? 'activa'">Reportes</a>
				<a th:href="@{/canon}" th:classappend="${r.startsWith('/canon')} ? 'activa'">Canon</a>
			</th:block>
			<a sec:authorize="hasRole('EMPLEADO')" th:href="@{/empleado}" th:classappend="${r == '/empleado'} ? 'activa'">Mi panel</a>
			<a sec:authorize="hasRole('EMPLEADO')" th:if="${esCajero}" th:href="@{/empleado/pedidos}" th:classappend="${r.startsWith('/empleado/pedidos')} ? 'activa'">Pedidos</a>
			<a sec:authorize="hasRole('EMPLEADO')" th:if="${esCajero}" th:href="@{/empleado/caja}" th:classappend="${r.startsWith('/empleado/caja')} ? 'activa'">Caja</a>
			<a sec:authorize="hasRole('EMPLEADO')" th:href="@{/empleado/liquidacion}" th:classappend="${r.startsWith('/empleado/liquidacion')} ? 'activa'">Liquidación de sueldo</a>
		</nav>
	</header>

	<span th:fragment="estadoFestival(f)" class="estado"
		th:classappend="${f.estado == 'En curso'} ? 'en-curso' : (${f.estado == 'Finalizado'} ? 'finalizado' : '')"
		th:text="${f.estado}"></span>
	<div th:fragment="mensajes">
		<p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
		<p class="error" th:if="${error}" th:text="${error}"></p>
	</div>
</body>

</html>
