spring.application.name=epicentro-gourmet

# Base de datos (valores por defecto para desarrollo local, se pisan con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:epicentro_gourmet}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Datos de prueba: se ejecuta data.sql en cada arranque (usa INSERT IGNORE, no duplica)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Mail (Gmail con contraseña de aplicación)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-reply@epicentrogourmet.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
